<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Intelligence</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Document Intelligence</h1>
      <p>Upload a financial document to extract fields and run validations.</p>
      <form id="process-form">
        <label>Document type
          <select id="document-type" required>
            <option value="invoice">Invoice</option>
            <option value="balance_sheet">Balance Sheet</option>
            <option value="profit_and_loss">Profit and Loss</option>
            <option value="cash_flow_statement">Cash Flow Statement</option>
          </select>
        </label>
        <label>PDF, JPG, or PNG
          <input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required />
        </label>
        <button type="submit">Process document</button>
      </form>
      <p id="message" class="message"></p>
      <section>
        <h2>Processed documents</h2>
        <div id="documents"></div>
      </section>
      <section id="summary" class="summary" hidden></section>
      <pre id="result"></pre>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
